name: Update screenshots

on:
  workflow_dispatch:

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: 'zulu'

jobs:



  RecordScreenshotMatrixSetup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - run: ./gradlew ciRecordScreenshotJobsMatrixSetup --stacktrace

      - id: matrix
        run: echo "matrix=$(cat build/record_screenshot_jobs_matrix.json | jq -c .)" >> $GITHUB_OUTPUT



  RecordScreenshot:
    needs: RecordScreenshotMatrixSetup
    runs-on: ${{ matrix.variants.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variants: ${{ fromJson(needs.RecordScreenshotMatrixSetup.outputs.matrix) }}
    steps:

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - id: screenshots_path
        run: |
          MODULE_PATH=$(echo "${{ matrix.variants.module_path }}" | sed 's/^://' | tr ':' '/')
          echo "path=${MODULE_PATH}/src/screenshots" >> $GITHUB_OUTPUT

      - name: Remove iOS screenshots
        if: runner.os == 'macOS'
        run: find ${{ steps.screenshots_path.outputs.path }} -name "*Ios*.png" -delete 2>/dev/null || true

      - name: Remove JVM and Android screenshots
        if: runner.os == 'Linux'
        run: |
          find ${{ steps.screenshots_path.outputs.path }} -name "*Jvm*.png" -delete 2>/dev/null || true
          find ${{ steps.screenshots_path.outputs.path }} -name "*Android*.png" -delete 2>/dev/null || true

      - run: ./gradlew ${{ matrix.variants.gradle_tasks }} -DIS_DATA_STUB_ENABLED=true --stacktrace

      - name: Install pngcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install pngcheck

      - name: Install pngcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y pngcheck

      - name: Validate iOS PNG files
        if: runner.os == 'macOS'
        run: find ${{ steps.screenshots_path.outputs.path }} -name "*Ios*.png" | xargs pngcheck -q

      - name: Validate JVM and Android PNG files
        if: runner.os == 'Linux'
        run: |
          find ${{ steps.screenshots_path.outputs.path }} \( -name "*Jvm*.png" -o -name "*Android*.png" \) | xargs pngcheck -q

      - run: git pull --rebase --autostash

      - uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: Update screenshots
